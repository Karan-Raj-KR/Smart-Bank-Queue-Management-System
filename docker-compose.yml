version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: bank_queue_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bank_queue
      MYSQL_USER: bank_user
      MYSQL_PASSWORD: bank_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    restart: unless-stopped

  redis:
    image: redis:7.0-alpine
    container_name: bank_queue_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  db_data:
